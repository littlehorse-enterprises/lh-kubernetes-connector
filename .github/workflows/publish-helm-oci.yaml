name: publish-helm-oci

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      path:
        required: false
        type: string
        default: "./helm"
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package helm
        run: |
          sed -i 's/^name:.*/name: ${{ inputs.name }}/' ${{ inputs.path }}/Chart.yaml
          helm package ${{ inputs.path }} -u --version ${{ inputs.version }} --app-version ${{ inputs.version }} -d ${{ inputs.path }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish helm chart to GHCR
        run: |
          helm push ${{ inputs.path }}/${{ inputs.name }}-${{ inputs.version }}.tgz oci://ghcr.io/littlehorse-enterprises

      - name: Write published image summary
        run: |
          {
            echo "## Published OCI Helm Chart"
            echo
            echo "The following OCI Helm chart was pushed:"
            echo "- \`ghcr.io/littlehorse-enterprises/${{ inputs.name }}:${{ inputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY" 
