name: shared-publish
on:
  workflow_call:
    inputs:
      version: 
        required: true
        type: string

permissions:
  packages: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Jar
        uses: actions/download-artifact@v8
        with:
          name: connector-jar
          path: build/quarkus-app/

      - name: Download Native
        uses: actions/download-artifact@v8
        with:
          name: connector-native
          path: build/quarkus-run

      - name: Build and Publish
        uses: littlehorse-enterprises/publish-image@v1
        with:
          image-name: lh-kubernetes-connector
          dockerfile: Dockerfile
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ghcr-root: true
          tags: |
            type=raw,value=latest,enable=false
            type=raw,value=${{ inputs.version }},enable=true
            type=ref,event=branch,enable=${{ github.ref_name == 'main' }}

  helm-oci:
    needs:
      - publish
    uses: ./.github/workflows/publish-helm-oci.yaml
    with:
      name: helm-lh-kubernetes-connector
      version: ${{ inputs.version }}
