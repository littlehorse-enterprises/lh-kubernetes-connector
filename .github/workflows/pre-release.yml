name: pre-release
run-name: Pre-Release ${{ github.ref_name }}
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-RC[0-9]+"

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/shared-tests.yaml
    with:
      upload-artifacts: true

  publish:
    needs:
      - tests
    uses: ./.github/workflows/shared-publish.yaml
    secrets: inherit

  release:
    uses: ./.github/workflows/shared-release.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      pre-release: true
