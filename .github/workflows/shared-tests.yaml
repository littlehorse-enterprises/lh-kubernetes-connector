name: shared-tests
on:
  workflow_call:
    inputs:
      upload-artifacts:
        type: "boolean"
        required: false
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Check
        run: ./gradlew check

      - name: Helm Lint
        run: helm lint helm/

  build:
    runs-on: ubuntu-latest
    needs:
      - tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Build Jar
        run: ./gradlew -x check build

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload-artifacts }}
        with:
          name: connector-jar
          path: build/quarkus-app/

      - name: Build Native
        run: >
          ./gradlew -x check build
          -Dquarkus.native.enabled=true
          -Dquarkus.package.runner-suffix=-run
          -Dquarkus.package.output-name=quarkus
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.container-build=true
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload-artifacts }}
        with:
          name: connector-native
          path: build/quarkus-run
