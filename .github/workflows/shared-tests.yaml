name: tests
on:
  workflow_call:
    inputs:
      upload-artifacts:
        type: 'boolean'
        required: false
        default: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"
      - name: Format
        run: ./gradlew spotlessJavaCheck

  tests:
    runs-on: ubuntu-latest
    needs:
      - format
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"
      - name: Tests
        run: ./gradlew -x spotlessJavaCheck test

  build:
    runs-on: ubuntu-latest
    needs:
      - tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "25"
      - name: Build Jar
        run: ./gradlew -x test -x spotlessCheck build
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload-artifacts }}
        with:
          name: connector-jar
          path: build/quarkus-app/
      - name: Build Native
        run: >
          ./gradlew -x test -x spotlessCheck build
          -Dquarkus.native.enabled=true
          -Dquarkus.package.runner-suffix=-run
          -Dquarkus.package.output-name=quarkus
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload-artifacts }}
        with:
          name: connector-native
          path: build/quarkus-run
