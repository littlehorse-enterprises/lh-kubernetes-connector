name: shared-tests
on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
      upload-artifacts:
        type: "boolean"
        required: false
        default: false
    outputs:
      version:
        description: "The version that was used for the build"
        value: ${{ jobs.tests.outputs.version }}

jobs:
  tests:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "Using provided version: ${{ inputs.version }}"
            version="${{ inputs.version }}"
          else
            echo "No version provided, using default from gradle.properties"
            version=$(cat gradle.properties | grep "^version=" | cut -d'=' -f2)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_version=$version" >> "$GITHUB_ENV"

      - name: Check
        run: ./gradlew check

      - name: Helm Lint
        run: helm lint helm/

  build:
    runs-on: ubuntu-latest
    needs:
      - tests
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.tests.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Build Jar
        run: ./gradlew -x check build

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload-artifacts }}
        with:
          name: connector-jar
          path: build/quarkus-app/

      - name: Build Native
        run: >
          ./gradlew -x check build
          -Dquarkus.native.enabled=true
          -Dquarkus.package.runner-suffix=-run
          -Dquarkus.package.output-name=quarkus
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.container-build=true
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload-artifacts }}
        with:
          name: connector-native
          path: build/quarkus-run
