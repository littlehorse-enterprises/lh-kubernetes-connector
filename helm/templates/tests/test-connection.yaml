apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "lh-kubernetes-connector.fullname" . }}-test-connection"
  labels:
    {{- include "lh-kubernetes-connector.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "lh-kubernetes-connector.fullname" . }}:{{ .Values.connector.port }}/live']
  restartPolicy: Never
